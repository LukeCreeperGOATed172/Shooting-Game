<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Space Shooter - Shield-Proof Edition</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            display: block;
            z-index: 1;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(0,255,220,0.6);
            line-height: 1.5;
            z-index: 10;
        }
        #gameover-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0055;
            text-align: center;
            display: none;
            pointer-events: auto;
            background: rgba(4, 4, 12, 0.95);
            padding: 30px;
            border: 2px solid #ff0055;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            z-index: 20;
            cursor: pointer;
        }
        #gameover-screen h1 { font-size: 50px; margin: 0 0 10px 0; }
        #gameover-screen p { color: #fff; font-size: 20px; margin: 5px 0; }
    </style>
</head>
<body>

    <div id="hud">
        SCORE: <span id="current-score">0</span><br>
        HIGH SCORE: <span id="high-score-hud">0</span>
    </div>
    
    <div id="gameover-screen">
        <h1>GAME OVER</h1>
        <p id="final-score">Final Score: 0</p>
        <p id="high-score-notice" style="color: #00ffcc; font-weight: bold; display: none;">NEW HIGH SCORE!</p>
        <p style="font-size: 16px; color: #888; margin-top: 20px;">Click anywhere to restart</p>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- Game Settings & Core 3D Projection Matrices ---
let score = 0;
let highScore = 0; 
let gameOver = false;
let spawnTimer = 0;

const FOV = 350; 
const PLANE_Z = 30; // Matrix focal plane for alignment targeting

const mouse = { x: 0, y: 0, screenX: window.innerWidth / 2, screenY: window.innerHeight / 2 };
const stars = [];
const lasers = [];
const asteroids = [];

// Starfield array mapping
for (let i = 0; i < 250; i++) {
    stars.push({
        x: (Math.random() - 0.5) * 2500,
        y: (Math.random() - 0.5) * 2000,
        z: Math.random() * 800
    });
}

window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.screenX = e.clientX - rect.left;
    mouse.screenY = e.clientY - rect.top;
    
    // RAYCAST SIMULATION: Maps screen space dimensions directly to focal vectors
    mouse.x = (mouse.screenX - canvas.width / 2) * (PLANE_Z / FOV);
    mouse.y = (mouse.screenY - canvas.height / 2) * (PLANE_Z / FOV);
});

window.addEventListener('click', () => {
    if (gameOver) {
        resetGame();
    } else {
        lasers.push({
            x: mouse.x,
            y: mouse.y,
            z: PLANE_Z,
            speed: 18
        });
    }
});

function spawnAsteroid() {
    asteroids.push({
        x: (Math.random() - 0.5) * 1200,
        y: (Math.random() - 0.5) * 900,
        z: 800, 
        size: Math.random() * 20 + 18, 
        speed: Math.random() * 3 + 5 + (score * 0.05)
    });
}

function resetGame() {
    score = 0;
    gameOver = false;
    lasers.length = 0;
    asteroids.length = 0;
    document.getElementById('current-score').innerText = score;
    document.getElementById('gameover-screen').style.display = 'none';
}

// --- Frame Rendering Engine Loop ---
function animate() {
    requestAnimationFrame(animate);

    // Deep space backdrop
    ctx.fillStyle = '#020208';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    // 1. Draw Starfield Matrix
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < stars.length; i++) {
        let s = stars[i];
        s.z -= 4; 
        if (s.z <= 0) s.z = 800; 

        let sx = (s.x / s.z) * FOV + cx;
        let sy = (s.y / s.z) * FOV + cy;
        let scale = (1 - s.z / 800) * 2.5;

        if (sx >= 0 && sx <= canvas.width && sy >= 0 && sy <= canvas.height) {
            ctx.fillRect(sx, sy, scale, scale);
        }
    }

    // 2. Draw Lasers
    for (let i = lasers.length - 1; i >= 0; i--) {
        let l = lasers[i];
        l.z += l.speed; 

        let lx = (l.x / l.z) * FOV + cx;
        let ly = (l.y / l.z) * FOV + cy;
        let lRadius = (1 - l.z / 800) * 10;
        if (lRadius < 1) lRadius = 1;

        ctx.fillStyle = '#ff0055';
        ctx.beginPath();
        ctx.arc(lx, ly, Math.max(1, lRadius), 0, Math.PI * 2);
        ctx.fill();

        if (l.z > 800) {
            lasers.splice(i, 1);
        }
    }

    // 3. Spawning Tracker Loop
    if (!gameOver) {
        spawnTimer++;
        let spawnRate = Math.max(10, 30 - score * 0.3);
        if (spawnTimer > spawnRate) {
            spawnAsteroid();
            spawnTimer = 0;
        }
    }

    // 4. Draw & Calculate Asteroids
    for (let i = asteroids.length - 1; i >= 0; i--) {
        let a = asteroids[i];
        a.z -= a.speed; 

        let ax = (a.x / a.z) * FOV + cx;
        let ay = (a.y / a.z) * FOV + cy;
        let aRadius = (FOV / a.z) * a.size; 

        if (a.z > 0) {
            ctx.fillStyle = '#32323a';
            ctx.strokeStyle = '#5a5a66';
            ctx.lineWidth = Math.max(1, (1 - a.z/800) * 3);
            ctx.beginPath();
            ctx.arc(ax, ay, Math.max(1, aRadius), 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Laser Intersections (Calculates true vector tracking space)
            for (let j = lasers.length - 1; j >= 0; j--) {
                let l = lasers[j];
                let dist3D = Math.hypot(l.x - a.x, l.y - a.y, l.z - a.z);
                
                if (dist3D < a.size * 1.6) { 
                    asteroids.splice(i, 1);
                    lasers.splice(j, 1);
                    score += 10;
                    document.getElementById('current-score').innerText = score;
                    break;
                }
            }

            // CRITICAL TRACKING LOCK: Direct structural check matching crosshair position values
            if (!gameOver && a.z <= PLANE_Z + 10 && a.z >= PLANE_Z - 10) {
                let hitDist = Math.hypot(mouse.x - a.x, mouse.y - a.y);
                if (hitDist < a.size + 10) { 
                    gameOver = true;
                    document.getElementById('final-score').innerText = `Final Score: ${score}`;
                    if (score > highScore) {
                        highScore = score;
                        document.getElementById('high-score-hud').innerText = highScore;
                        document.getElementById('high-score-notice').style.display = 'block';
                    } else {
                        document.getElementById('high-score-notice').style.display = 'none';
                    }
                    document.getElementById('gameover-screen').style.display = 'block';
                }
            }
        }

        if (a.z <= PLANE_Z - 10) {
            asteroids.splice(i, 1);
        }
    }

    // 5. Draw 3D Player Starship (Glued right to the mouse screen tracking vectors)
    if (!gameOver) {
        let px = mouse.screenX;
        let py = mouse.screenY;

        ctx.fillStyle = '#00ffcc';
        ctx.strokeStyle = '#0088cc';
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.moveTo(px, py - 16); 
        ctx.lineTo(px - 24, py + 14); 
        ctx.lineTo(px, py + 5); 
        ctx.lineTo(px + 24, py + 14); 
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        // Reticle alignment system
        ctx.strokeStyle = 'rgba(0, 255, 204, 0.25)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(px, py, 26, 0, Math.PI * 2);
        ctx.moveTo(px - 36, py); ctx.lineTo(px - 12, py);
        ctx.moveTo(px + 12, py); ctx.lineTo(px + 36, py);
        ctx.moveTo(px, py - 36); ctx.lineTo(px, py - 12);
        ctx.moveTo(px, py + 12); ctx.lineTo(px, py + 36);
        ctx.stroke();
    }
}

animate();
</script>
</body>
</html>
